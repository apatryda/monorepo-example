compressionLevel: mixed
enableGlobalCache: false
nodeLinker: pnp
packageExtensions:
  "@acemir/cssom@*":
    dependencies:
      cssstyle: "*"
  "@tensorflow-models/universal-sentence-encoder@*":
    dependencies:
      "@tensorflow/tfjs-converter": "*"
      "@tensorflow/tfjs-core": "*"
  "@tensorflow/tfjs@*":
    dependencies:
      long: "*"
  "@tensorflow/tfjs-node@*":
    dependencies:
      "@tensorflow/tfjs-core": "*"
  "@types/express@*":
    dependencies:
      body-parser: "*"
      serve-static: "*"
  "@types/express-serve-static-core@*":
    dependencies:
      events: "*"
      qs: "*"
      range-parser: "*"
      send: "*"
  "@types/node@*":
    dependencies:
      buffer: "*"
      events: "*"
      punycode: "*"
      string_decoder: "*"
  "@types/pg@*":
    dependencies:
      events: "*"
  "@types/serve-static@*":
    dependencies:
      http-errors: "*"
      send: "*"
  "@types/send@*":
    dependencies:
      mime: "*"
  "@types/superagent@*":
    dependencies:
      buffer: "*"
      cookiejar: "*"
      methods: "*"
  "@types/supertest@*":
    dependencies:
      methods: "*"
      superagent: "*"
  "@vitejs/plugin-vue@*":
    peerDependencies:
      supports-color: "*"
  "@vue/compiler-sfc@*":
    dependencies:
      pug: "*"
  debug@*:
    dependencies:
      supports-color: "*"
  ts-jest@*:
    dependencies:
      jest-util: "*"
  typeorm@*:
    dependencies:
      events: "*"
  undici-types@*:
    dependencies:
      buffer: "*"
      events: "*"
  unplugin-vue-router@*:
    peerDependencies:
      "@vue/compiler-sfc": "*"
  vite@*:
    dependencies:
      ms: "*"
    peerDependencies:
      supports-color: "*"
  vue-loader@*:
    peerDependencies:
      "@vue/compiler-sfc": "*"
      webpack: "*"
pnpMode: loose
